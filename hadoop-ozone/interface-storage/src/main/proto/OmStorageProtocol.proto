/**
 * These .proto interfaces are private and unstable.
 * Please see http://wiki.apache.org/hadoop/Compatibility
 * for what changes are allowed for a *unstable* .proto interface.
 */

syntax = "proto2";
option java_package = "org.apache.hadoop.ozone.storage.proto";
option java_outer_classname = "OzoneManagerStorageProtos";
option java_generic_services = true;
option java_generate_equals_and_hash = true;
package hadoop.ozone;

import "hdds.proto";

message OzoneAclInfo {
  enum OzoneAclType {
    USER = 1;
    GROUP = 2;
    WORLD = 3;
    ANONYMOUS = 4;
    CLIENT_IP = 5;
  }

  enum OzoneAclScope {
    ACCESS = 0;
    DEFAULT = 1;
  }

  required OzoneAclType type = 1;
  required string name = 2;
  required bytes rights = 3;
  required OzoneAclScope aclScope = 4 [default = ACCESS];
}

message PersistedPrefixInfo {
  required string name = 1;
  repeated OzoneAclInfo acls = 2;
  repeated hadoop.hdds.KeyValue metadata = 3;
  optional uint64 objectID = 4;
  optional uint64 updateID = 5;
}

message PersistedUserVolumeInfo {
  repeated string volumeNames = 1;
  optional uint64 objectID = 2;
  optional uint64 updateID = 3;
}

message GlobalStatsValueProto {
    required int64 value = 1;
}

message FileSizeCountKeyProto {
    required string volume = 1;
    required string bucket = 2;
    required int64 fileSizeUpperBound = 3;
}

message SnapDiffObjectInfo {
  optional uint64 objectID = 1;
  optional string keyName = 2;
}

// Reverse lookup value for a live FSO object. Identity is carried by the table key.
message PersistedNfsObjectInfo {
  enum Kind {
    DIRECTORY = 1;
    FILE = 2;
  }
  required Kind kind = 1;
  required uint64 parentObjectID = 2;
  required string name = 3;
}

// OM-owned lease state used to fence NFS gateway writers across Ozone clients.
message PersistedNfsLeaseInfo {
  enum Kind {
    EXPORT = 1;
    FILE = 2;
  }
  required Kind kind = 1;
  required string exportUUID = 2;
  required uint64 generation = 3;
  required uint64 expiresAtMillis = 4;
  optional string gatewayID = 5;
  optional uint64 gatewayGeneration = 6;
  optional uint64 volumeID = 7;
  optional uint64 bucketID = 8;
  optional uint64 objectID = 9;
  optional string transferID = 10;
  optional bytes ownerToken = 11;
  optional string ownerPrincipal = 12;
  optional bool contentPublished = 13;
}

// A durable staged byte range owned by one NFS file lease generation.
message PersistedNfsTransferRangeInfo {
  required string exportUUID = 1;
  required uint64 volumeID = 2;
  required uint64 bucketID = 3;
  required uint64 objectID = 4;
  required uint64 leaseGeneration = 5;
  required uint64 offset = 6;
  required uint64 length = 7;
  required string transferID = 8;
  required string stagingKey = 9;
  required bytes sha256 = 10;
  optional uint64 transactionIndex = 11;
}
