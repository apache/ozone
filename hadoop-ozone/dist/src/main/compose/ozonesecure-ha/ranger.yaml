x-om-ranger-config:
  &om-ranger-config
    environment:
      # Ranger 2.8.x+ ozone-plugin tarball: jars live under lib/libext/ and
      # lib/libext/ranger-ozone-plugin-impl/ (ranger-audit-dest-solr-*.jar is in the impl dir).
      OZONE_MANAGER_CLASSPATH: "/opt/ranger/ozone-plugin/lib/libext/*:/opt/ranger/ozone-plugin/lib/libext/ranger-ozone-plugin-impl/*:/opt/ozone/conf"
      OZONE-SITE.XML_ozone.acl.authorizer.class: "org.apache.ranger.authorization.ozone.authorizer.RangerOzoneAuthorizer"
      OZONE-SITE.XML_ozone.om.multitenancy.enabled: "true"
      OZONE-SITE.XML_ozone.om.ranger.https-address: "http://ranger:6080"
      OZONE-SITE.XML_ozone.om.ranger.https.admin.api.user: "admin"
      OZONE-SITE.XML_ozone.om.ranger.https.admin.api.passwd: "rangerR0cks!"
      OZONE-SITE.XML_ozone.om.ranger.service: "dev_ozone"
      OZONE-SITE.XML_ozone.om.tenant.dev.skip.ranger: "false"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.forceNonKerberos: "true"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.url: "http://ranger:6080"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.client.username: "admin"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.policy.rest.client.password: "rangerR0cks!"
      RANGER-OZONE-SECURITY.XML_ranger.plugin.ozone.service.name: "dev_ozone"
    volumes:
      - ../..:/opt/hadoop
      - ../_keytabs:/etc/security/keytabs
      - ./krb5.conf:/etc/krb5.conf
      - ${RANGER_OZONE_PLUGIN_DIR}:/opt/ranger/ozone-plugin
    tmpfs:
      - /opt/ozone/conf
    # JDK17+ no longer ships javax.annotation, but the Ranger Ozone plugin's Jersey2
    # client needs javax.annotation.Priority. Copy the jar into the plugin impl dir
    # so the isolated RangerPluginClassLoader can find it.
    command: bash -c 'sudo mkdir -p /opt/ranger/ozone-plugin/lib/libext/ranger-ozone-plugin-impl && for j in /opt/hadoop/share/ozone/lib/javax.annotation-api-*.jar; do [ -e "$$j" ] || continue; sudo cp -n "$$j" /opt/ranger/ozone-plugin/lib/libext/ranger-ozone-plugin-impl/; done && sudo --preserve-env /opt/ranger/ozone-plugin/enable-ozone-plugin.sh && exec /opt/hadoop/bin/ozone om'

services:
  om1:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  om2:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  om3:
    <<: *om-ranger-config
    depends_on:
      ranger:
        condition: service_healthy
  ranger:
    networks:
      ozone_net:
        ipv4_address: 172.25.0.200
  ranger-db:
    networks:
      ozone_net:
        ipv4_address: 172.25.0.201
