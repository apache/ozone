# Override for running the cluster on an IPv6-only network.
# Other environments keep the default bind host (0.0.0.0); here the bind host
# properties are set to the IPv6 wildcard address explicitly.
# SCM HA reads the RPC bind hosts only from the keys with service ID and node ID.
x-ipv6-config:
  &ipv6-config
  environment:
    HTTPFS-SITE.XML_httpfs.http.hostname: "::"
    OZONE-SITE.XML_hdds.datanode.client.bind.host: "::"
    OZONE-SITE.XML_hdds.datanode.http-bind-host: "::"
    OZONE-SITE.XML_ozone.om.http-bind-host: "::"
    OZONE-SITE.XML_ozone.recon.http-bind-host: "::"
    OZONE-SITE.XML_ozone.s3g.http-bind-host: "::"
    OZONE-SITE.XML_ozone.s3g.webadmin.http-bind-host: "::"
    OZONE-SITE.XML_ozone.scm.block.client.bind.host.scmservice.scm1: "::"
    OZONE-SITE.XML_ozone.scm.block.client.bind.host.scmservice.scm2: "::"
    OZONE-SITE.XML_ozone.scm.block.client.bind.host.scmservice.scm3: "::"
    OZONE-SITE.XML_ozone.scm.client.bind.host.scmservice.scm1: "::"
    OZONE-SITE.XML_ozone.scm.client.bind.host.scmservice.scm2: "::"
    OZONE-SITE.XML_ozone.scm.client.bind.host.scmservice.scm3: "::"
    OZONE-SITE.XML_ozone.scm.datanode.bind.host.scmservice.scm1: "::"
    OZONE-SITE.XML_ozone.scm.datanode.bind.host.scmservice.scm2: "::"
    OZONE-SITE.XML_ozone.scm.datanode.bind.host.scmservice.scm3: "::"
    OZONE-SITE.XML_ozone.scm.http-bind-host: "::"

services:
  datanode:
    <<: *ipv6-config
  om1:
    <<: *ipv6-config
  om2:
    <<: *ipv6-config
  om3:
    <<: *ipv6-config
  scm1:
    <<: *ipv6-config
  scm2:
    <<: *ipv6-config
  scm3:
    <<: *ipv6-config
  httpfs:
    <<: *ipv6-config
  s3g:
    <<: *ipv6-config
  recon:
    <<: *ipv6-config

networks:
  default:
    enable_ipv4: false
    enable_ipv6: true
