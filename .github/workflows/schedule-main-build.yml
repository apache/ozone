# This workflow runs CI on the default branch periodically.

name: build-default-branch

on:
  schedule:
    - cron: '33 */4 * * *'
  workflow_dispatch:
    # manual trigger: for testing in forks, and safety net in apache

concurrency:
  # only one build at a time
  group: scheduled-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  CI:
    # no scheduled run in forks
    if: github.repository_owner == 'apache' || github.event_name == 'workflow_dispatch'
    uses: $/.github/workflows/ci.yml
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.OZONE_DEVELOCITY_ACCESS_KEY }}
      OZONE_WEBSITE_BUILD: ${{ secrets.OZONE_WEBSITE_BUILD }}
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
