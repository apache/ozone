name: Fork CI ping

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      # the list should match base-branches in fork-ci-status.yaml
      - master

permissions: {}

jobs:
  ping:
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: ping
        run: |
          echo 'This job just pings `Fork CI status` workflow that the PR was created or updated.'
