name: Fork CI status

on:
  schedule:
    - cron: '6,21,36,51 * * * *'
  workflow_dispatch:

  # fork-ci-status only reads API metadata and writes checks.
  # It does not run PR code, read artifacts, approve workflows, or edit PRs.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Fork CI ping]
    types: [completed]

permissions:
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: fork-ci-status
  cancel-in-progress: false
  queue: max # do not cancel pending jobs

jobs:
  bridge:
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: apache/infrastructure-actions/fork-ci@fork-ci/v1
        with:
          workflow: post-commit.yml
          base-branches: |
            master
          check-name: build-branch (fork)
          recent-hours: 6
          sweep-minutes: '15'
